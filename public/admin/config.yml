# Decap CMS configuration
# Docs: https://decapcms.org/docs/configuration-options/
#
# Field definitions mirror the Astro content schema in src/content.config.ts.
# Any key present in a content file MUST have a field here, otherwise Decap
# drops it on save. Number fields always set value_type explicitly: Decap's
# number widget parses with parseInt unless value_type is "float".

backend:
  name: github
  repo: bgross0/lco-astro
  branch: main
  base_url: https://lakecountyoutdoor.com
  auth_endpoint: api/auth
  auth_scope: public_repo
  squash_merges: true
  commit_messages:
    create: "content: create {{collection}} \"{{slug}}\""
    update: "content: update {{collection}} \"{{slug}}\""
    delete: "content: delete {{collection}} \"{{slug}}\""
    uploadMedia: "content: upload \"{{path}}\""
    deleteMedia: "content: delete \"{{path}}\""
publish_mode: editorial_workflow
media_folder: public/images/uploads
public_folder: /images/uploads
site_url: https://lakecountyoutdoor.com
display_url: https://lakecountyoutdoor.com
logo_url: /images/brand/lco-logo.png
local_backend: true

collections:
  # ---------------------------------------------------------------------------
  # Homepage (src/content/homepage/home.json)
  # ---------------------------------------------------------------------------
  - name: homepage
    label: Homepage
    delete: false
    editor:
      preview: false
    files:
      - name: home
        label: Homepage
        file: src/content/homepage/home.json
        format: json
        fields:
          - &seo
            label: SEO
            name: seo
            widget: object
            fields:
              - { label: Meta title, name: title, widget: string }
              - { label: Meta description, name: description, widget: text }
          - &heroWithImage
            label: Hero
            name: hero
            widget: object
            fields:
              - { label: Heading (H1), name: heading, widget: string }
              - { label: Text, name: text, widget: text, required: false }
              - { label: Background image, name: image, widget: image }
              - { label: Image description (alt text), name: imageAlt, widget: string }
          - &heading
            label: Services section
            name: services
            widget: object
            hint: The service cards come from the Services collection, grouped by category.
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text, required: false }
          - label: Shoreline Solutions banner
            name: shoreline
            widget: object
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Link text, name: linkText, widget: string }
              - { label: Link, name: link, widget: string }
          - label: About section
            name: about
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Image, name: image, widget: image }
              - { label: Image description (alt text), name: imageAlt, widget: string }
          - label: About highlights
            name: highlights
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - label: Items
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
                  - { label: Image (or video poster), name: image, widget: image }
                  - { label: Image description (alt text), name: imageAlt, widget: string }
                  - { label: Video (MP4, optional), name: video, widget: file, required: false }
                  - label: Stats
                    name: stats
                    widget: list
                    required: false
                    summary: "{{fields.value}} {{fields.label}}"
                    fields:
                      - { label: Value, name: value, widget: string, hint: "Text, e.g. 10+" }
                      - { label: Label, name: label, widget: string }
                  - { label: Tags, name: tags, widget: list, required: false, field: { label: Tag, name: tag, widget: string } }
          - { <<: *heading, label: Reviews section, name: reviews, hint: Shows the first reviews from the Reviews collection. }
          - label: Social section
            name: social
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: string, required: false }
              - { label: Footnote, name: footnote, widget: string, required: false }
          - label: Offer
            name: offer
            widget: object
            fields:
              - { label: Section title, name: title, widget: string }
              - { label: Offer name, name: name, widget: string }
              - { label: Offer value, name: value, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button text, name: buttonText, widget: string }
              - { label: Button link, name: link, widget: string }
          - { <<: *heading, label: Projects section, name: projects }
          - { <<: *heading, label: Areas section, name: areas, hint: The city list comes from the Service Areas page. }
          - label: Featured review
            name: featuredReview
            widget: relation
            collection: reviews
            value_field: "{{slug}}"
            search_fields: [author, text]
            display_fields: [author]
            required: false
          - { <<: *heading, label: Closing call to action, name: cta }

  # ---------------------------------------------------------------------------
  # Services (src/content/services/*.md) -> /services/<file name>/
  # ---------------------------------------------------------------------------
  - name: services
    label: Services
    label_singular: Service
    folder: src/content/services
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "services/{{slug}}/"
    sortable_fields: [order, title, category]
    summary: "{{order}}. {{title}} ({{category}})"
    fields:
      - { label: Service name, name: title, widget: string }
      - { label: Card summary, name: summary, widget: text, hint: One sentence shown on service cards and in structured data. }
      - label: Category
        name: category
        widget: select
        options: [Landscape Services, Excavation & Build, Property Maintenance, Tree Services]
      # Required: a cleared optional number is saved as "" which fails z.number().
      - { label: Display order, name: order, widget: number, value_type: int, min: 1 }
      - *seo
      - *heroWithImage
      - { label: Intro heading, name: heading, widget: string }
      - &process
        label: Process
        name: process
        widget: object
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text, required: false }
          - label: Steps
            name: steps
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
      - label: FAQ
        name: faq
        widget: object
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text, required: false }
          - label: Questions
            name: items
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }
      - { <<: *heading, label: Reviews section, name: reviews }
      - { <<: *heading, label: Closing call to action, name: cta }
      - { label: Body, name: body, widget: markdown, hint: "Intro paragraphs. Use ## headings for extra sections." }

  # ---------------------------------------------------------------------------
  # Service areas (src/content/service-areas/*.md) -> /service-areas/<file name>/
  # Every city served is listed on the Service Areas page; add a city here only
  # with copy written for it, and remove its line from public/_redirects.
  # ---------------------------------------------------------------------------
  - name: serviceAreas
    label: Service Area Pages
    label_singular: Service Area Page
    folder: src/content/service-areas
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.city}}-mn"
    identifier_field: city
    preview_path: "service-areas/{{slug}}/"
    summary: "{{city}}, {{state}}"
    fields:
      - { label: City, name: city, widget: string }
      - { label: State, name: state, widget: string, default: MN }
      - *seo
      - *heroWithImage
      - { label: Content heading, name: heading, widget: string }
      - { <<: *heading, label: Reviews section, name: reviews }
      - { <<: *heading, label: Closing call to action, name: cta }
      - { label: Body, name: body, widget: markdown }

  # ---------------------------------------------------------------------------
  # Projects (src/content/projects/*.md) -> /projects/<file name>/
  # ---------------------------------------------------------------------------
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "projects/{{slug}}/"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Location, name: location, widget: string, required: false }
      - { label: Summary, name: summary, widget: text }
      - *seo
      - { label: Main image, name: image, widget: image }
      - { label: Main image description (alt text), name: imageAlt, widget: string }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        summary: "{{fields.alt}}"
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Description (alt text), name: alt, widget: string }
      - { label: Body, name: body, widget: markdown }

  # ---------------------------------------------------------------------------
  # Reviews (src/content/reviews/*.json): real reviews only, attributed as on Google
  # ---------------------------------------------------------------------------
  - name: reviews
    label: Reviews
    label_singular: Review
    folder: src/content/reviews
    create: true
    extension: json
    format: json
    slug: "{{fields.order}}-{{fields.author}}"
    identifier_field: author
    sortable_fields: [order, author, date]
    summary: "{{order}}. {{author}}"
    fields:
      - { label: Reviewer (as shown on Google), name: author, widget: string }
      - { label: Rating (1-5), name: rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
      - { label: Source, name: source, widget: string, default: Google }
      - { label: Display order, name: order, widget: number, value_type: int, min: 1 }
      - { label: Date posted, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, required: false }
      - { label: Review text, name: text, widget: text }

  # ---------------------------------------------------------------------------
  # Blog (src/content/blog/*.md)
  # ---------------------------------------------------------------------------
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{slug}}/"
    sortable_fields: [pubDate, title]
    summary: "{{pubDate}} - {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - label: Publication Date
        name: pubDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - { label: Author, name: author, widget: string, required: false, default: Lake County Outdoors }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Image Alt Text, name: imageAlt, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false, hint: Comma-separated }
      - { label: Draft, name: draft, widget: boolean, required: false, default: false }
      - { label: Body, name: body, widget: markdown }

  # ---------------------------------------------------------------------------
  # Pages (src/content/pages/*.md). Each page lists only the fields it renders.
  # ---------------------------------------------------------------------------
  - name: pages
    label: Pages
    delete: false
    editor:
      preview: false
    files:
      - name: about-us
        label: About Us
        file: src/content/pages/about-us.md
        format: frontmatter
        fields:
          - *seo
          - *heroWithImage
          - { label: Story heading, name: heading, widget: string }
          - { label: Services section title, name: servicesTitle, widget: string }
          - { <<: *heading, label: Closing call to action, name: cta }
          - { label: Story, name: body, widget: markdown }

      - name: contact-us
        label: Contact Us
        file: src/content/pages/contact-us.md
        format: frontmatter
        fields:
          - *seo
          - *heroWithImage
          - label: Form
            name: form
            widget: object
            hint: Labels only. The form fields and where submissions go are set in code.
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - { label: Subtitle, name: subtitle, widget: string, required: false }
              - { label: Submit button text, name: submitButtonText, widget: string, required: false }
          - { <<: *heading, label: Contact details card, name: details, hint: "Address, phones, email and hours come from Settings." }
          - { <<: *heading, label: Reviews section, name: reviews }
          - { <<: *heading, label: Closing call to action, name: cta }

      - name: reviews
        label: Reviews Page
        file: src/content/pages/reviews.md
        format: frontmatter
        fields:
          - *seo
          - &heroPlain
            label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading (H1), name: heading, widget: string }
              - { label: Text, name: text, widget: text, required: false }

      - name: gallery
        label: Gallery
        file: src/content/pages/gallery.md
        format: frontmatter
        fields:
          - *seo
          - *heroPlain
          - label: Photos
            name: images
            widget: list
            summary: "{{fields.alt}}"
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Description (alt text), name: alt, widget: string }

      - name: projects
        label: Projects Page
        file: src/content/pages/projects.md
        format: frontmatter
        fields:
          - *seo
          - *heroPlain

      - name: shoreline-solutions
        label: Shoreline Solutions
        file: src/content/pages/shoreline-solutions.md
        format: frontmatter
        fields:
          - *seo
          - label: Permit notice
            name: notice
            widget: object
            required: false
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Text, name: text, widget: string }
          - *heroWithImage
          - { label: Logo, name: logo, widget: image, required: false }
          - label: Services
            name: services
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text, required: false }
              - label: Services
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
          - label: Why choose us
            name: why
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text, required: false }
              - { label: Points, name: points, widget: list, field: { label: Point, name: point, widget: string } }
              - { label: Tagline, name: tagline, widget: string, required: false }
              - { label: Button text, name: buttonText, widget: string }
          - label: Process
            name: process
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - label: Steps
                name: steps
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
              - { label: Button text, name: buttonText, widget: string, required: false }
          - { <<: *heading, label: Closing call to action, name: cta }

      - name: service-areas
        label: Service Areas Page
        file: src/content/pages/service-areas.md
        format: frontmatter
        fields:
          - *seo
          - *heroPlain
          - label: Cities served
            name: cities
            widget: list
            hint: "City names only (no state). A city links to its own page when one exists under Service Area Pages."
            field: { label: City, name: city, widget: string }
          - { <<: *heading, label: Closing call to action, name: cta }

      - name: services
        label: Services Page
        file: src/content/pages/services.md
        format: frontmatter
        fields:
          - *seo
          - *heroPlain
          - { <<: *heading, label: Closing call to action, name: cta }

      - name: sitemap
        label: Sitemap Page
        file: src/content/pages/sitemap.md
        format: frontmatter
        fields:
          - *seo
          - *heroPlain

  # ---------------------------------------------------------------------------
  # Settings (src/data/*.json, imported directly; no zod schema)
  # ---------------------------------------------------------------------------
  - name: settings
    label: Settings
    delete: false
    editor:
      preview: false
    files:
      - name: site
        label: Business Details
        file: src/data/settings.json
        format: json
        fields:
          - { label: Business name, name: site_title, widget: string }
          - { label: Default meta description, name: site_description, widget: text }
          - { label: Logo, name: logo, widget: image, hint: "PNG; put a .webp copy with the same name next to it." }
          - { label: Footer logo (for dark backgrounds), name: footerLogo, widget: image }
          - { label: Default social sharing image, name: og_image, widget: image }
          - label: Phone numbers
            name: phones
            widget: list
            hint: The first number is used for every Call button and in search results.
            summary: "{{fields.label}} {{fields.number}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Number, name: number, widget: string }
          - { label: Email, name: email, widget: string }
          - label: Address
            name: address
            widget: object
            fields:
              - { label: Street, name: street, widget: string }
              - { label: City, name: city, widget: string }
              - { label: State, name: region, widget: string }
              - { label: ZIP, name: postalCode, widget: string }
          - label: Map location
            name: geo
            widget: object
            fields:
              - { label: Latitude, name: latitude, widget: number, value_type: float, step: 0.000001 }
              - { label: Longitude, name: longitude, widget: number, value_type: float, step: 0.000001 }
          - label: Hours
            name: hours
            widget: list
            summary: "{{fields.label}}: {{fields.opens}}-{{fields.closes}}"
            fields:
              - { label: Label, name: label, widget: string, hint: "e.g. Monday - Friday" }
              - { label: Days (schema.org), name: days, widget: string, hint: "Mo-Fr, Sa, Su ..." }
              - { label: Opens (24h), name: opens, widget: string, pattern: ['^\d{2}:\d{2}$', 'HH:MM'] }
              - { label: Closes (24h), name: closes, widget: string, pattern: ['^\d{2}:\d{2}$', 'HH:MM'] }
          - label: Social media
            name: social
            widget: object
            fields:
              - { label: Facebook URL, name: facebook, widget: string, required: false }
              - { label: Instagram URL, name: instagram, widget: string, required: false }
              - { label: Instagram handle, name: instagramHandle, widget: string, required: false }
              - { label: Facebook page name, name: facebookName, widget: string, required: false }
              - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
          - label: Google reviews
            name: google
            widget: object
            fields:
              - { label: Reviews URL, name: reviewsUrl, widget: string }
              - { label: Write-a-review URL, name: writeReviewUrl, widget: string }
          - label: Analytics
            name: analytics
            widget: object
            required: false
            fields:
              - { label: Google Tag Manager ID, name: gtmId, widget: string, required: false }
              - { label: Google Analytics ID, name: gaId, widget: string, required: false }
              - { label: Enable Tracking, name: enableTracking, widget: boolean, required: false }
          - label: A/B Tests
            name: abTests
            widget: object
            required: false
            fields:
              - label: Homepage CTA Test
                name: homepageCTA
                widget: object
                required: false
                fields:
                  - { label: Enabled, name: enabled, widget: boolean, required: false }
                  - label: Variants
                    name: variants
                    widget: list
                    required: false
                    summary: "{{fields.text}} ({{fields.trackingLabel}})"
                    fields:
                      - { label: Text, name: text, widget: string, required: false }
                      - { label: Tracking Label, name: trackingLabel, widget: string, required: false }
              - label: Contact Button Test
                name: contactButton
                widget: object
                required: false
                fields:
                  - { label: Enabled, name: enabled, widget: boolean, required: false }
                  - label: Variants
                    name: variants
                    widget: list
                    required: false
                    summary: "{{fields.text}} ({{fields.trackingLabel}})"
                    fields:
                      - { label: Text, name: text, widget: string, required: false }
                      - { label: Tracking Label, name: trackingLabel, widget: string, required: false }

      - name: navigation
        label: Navigation
        file: src/data/navigation.json
        format: json
        fields:
          - label: Main menu
            name: mainMenu
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
              - { label: List every service under this item, name: servicesMenu, widget: boolean, required: false }
              - label: Dropdown links
                name: dropdown
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Footer company links
            name: footerCompany
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
